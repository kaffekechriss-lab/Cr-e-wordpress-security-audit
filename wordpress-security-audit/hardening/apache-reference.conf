# Reference only — review the existing Apache configuration before applying.
# Place the Directory block in the appropriate Apache virtual host/config context.
<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Deny direct HTTP access to WordPress configuration and common secret files.
<FilesMatch "^(wp-config\.php|\.htaccess|\.htpasswd)$">
    Require all denied
</FilesMatch>

# In /etc/apache2/conf-available/security.conf:
# ServerTokens Prod
# ServerSignature Off

# Validate before reload:
# sudo apache2ctl configtest
# sudo systemctl reload apache2
